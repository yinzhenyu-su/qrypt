name: CI

on:
  push:
    branches: [main, feat/*]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run ./...

      - name: Vulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # Docs for for-user are generated from qrypt.schema.json; fail the
      # build when the schema changed without regenerating them.
      - name: Generated docs in sync
        run: |
          python3 scripts/gen-config-docs.py
          python3 scripts/gen-driver-docs.py
          if ! git diff --quiet -- docs/for-user/; then
            echo "docs/for-user is stale; re-run:"
            echo "  python3 scripts/gen-config-docs.py"
            echo "  python3 scripts/gen-driver-docs.py"
            git diff --stat docs/for-user/
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      # PR-stage coverage visibility: non-blocking snapshot of the six
      # core packages with a highlight on packages changed by this PR.
      # The hard floor gate runs in nightly only (scripts/coverage.sh).
      - name: Coverage report (PR snapshot)
        if: github.event_name == 'pull_request'
        run: bash scripts/pr-coverage-report.sh "${{ github.event.pull_request.base.sha }}"

      # VFS tests exercise the async upload engine (worker shutdown, staging
      # cleanup, journaling); a triple run catches the occasional timing
      # flake before it reaches main.
      - name: VFS Stability
        run: go test -count=3 ./pkg/vfs/
      - name: Localfs Smoke
        run: scripts/smoke-localfs.sh

      # Race covers the concurrency-heavy packages: the VFS/upload engine,
      # the task manager, the mobile/core session layer and the CLI sync
      # machinery, plus every driver and the mount adapter.
      - name: Race Test
        run: go test -race -count=1 ./pkg/vfs ./pkg/drive ./pkg/drivers/... ./internal/control ./internal/logging ./internal/cli ./pkg/core ./pkg/mobile ./pkg/crypt ./pkg/task ./cmd/qrypt

  update-changelog:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: bash scripts/gen-changelog.sh "${{ inputs.version || github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化,跳过提交"
          else
            git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

  dist-linux-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
            output: qrypt-linux-amd64
            goos: linux
            goarch: amd64
            archive_format: tar.gz
            kind: linux-docker
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            output: qrypt-linux-arm64
            goos: linux
            goarch: arm64
            archive_format: tar.gz
            kind: linux-docker
          - target: windows-amd64
            runner: ubuntu-latest
            output: qrypt-windows-amd64.exe
            goos: windows
            goarch: amd64
            archive_format: zip
            kind: windows-go
          - target: windows-arm64
            runner: ubuntu-latest
            output: qrypt-windows-arm64.exe
            goos: windows
            goarch: arm64
            archive_format: zip
            kind: windows-go
    steps:
      - uses: actions/checkout@v7
        with:
          # 构建 tag 的源码(dispatch 时用 inputs.version),保证二进制内嵌版本号正确
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@v6
        if: matrix.kind == 'windows-go'
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: matrix.kind == 'linux-docker'

      - run: mkdir -p dist

      - name: Build ${{ matrix.target }} with Docker
        if: matrix.kind == 'linux-docker'
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=qrypt-${{ matrix.target }} \
            --cache-to type=gha,mode=max,scope=qrypt-${{ matrix.target }} \
            --load \
            -t qrypt:${{ matrix.target }} .
          docker create --name qrypt-${{ matrix.target }} qrypt:${{ matrix.target }}
          docker cp qrypt-${{ matrix.target }}:/usr/local/bin/qrypt dist/${{ matrix.output }}
          docker rm qrypt-${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        if: matrix.kind == 'windows-go'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} go build -tags nocgo -ldflags="-s -w" \
            -o dist/${{ matrix.output }} ./cmd/qrypt/

      - name: Package ${{ matrix.target }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          asset="qrypt_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            (cd dist && zip "${asset}.zip" "${{ matrix.output }}")
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${{ matrix.output }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: qrypt-${{ matrix.target }}-${{ inputs.version || github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  dist-darwin:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install macFUSE
        run: |
          brew install --cask macfuse

      - run: mkdir -p dist

      - name: Build darwin/amd64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" \
            -o dist/qrypt-darwin-amd64 ./cmd/qrypt/

      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="-s -w" \
            -o dist/qrypt-darwin-arm64 ./cmd/qrypt/

      - name: Package darwin binaries
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          tar -C dist -czf "dist/qrypt_${version}_darwin_amd64.tar.gz" qrypt-darwin-amd64
          tar -C dist -czf "dist/qrypt_${version}_darwin_arm64.tar.gz" qrypt-darwin-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: qrypt-darwin-${{ inputs.version || github.ref_name }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [dist-linux-windows, dist-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # dispatch 时 checkout 到发布 tag,与 tag push 行为一致(goreleaser 要求 tag == HEAD)
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -l "${{ inputs.version }}" | grep -q . || { echo "tag ${{ inputs.version }} 不存在"; exit 1; }

      - uses: actions/download-artifact@v7
        with:
          pattern: qrypt-*
          merge-multiple: true
          path: dist/

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version || github.ref_name }}
