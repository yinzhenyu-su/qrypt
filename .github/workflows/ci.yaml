name: CI

on:
  push:
    branches: [main, feat/*]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
          - name: fast
          - name: race
          - name: stability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install FUSE headers
        run: |
          # The runner image usually already ships libfuse3-dev, and apt-get
          # update is the slow half of this step; only reach for apt when the
          # headers the cgo build actually needs are missing.
          if pkg-config --exists fuse3; then
            echo "libfuse3-dev already present"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3

      - name: Cache CI tools
        if: matrix.name == 'static'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/.cache/qrypt-tools
          key: qrypt-tools-${{ runner.os }}-${{ hashFiles('tools.go') }}

      - name: Install CI tools
        if: matrix.name == 'static'
        env:
          QRYPT_TOOLS_DIR: ${{ github.workspace }}/.cache/qrypt-tools
        run: scripts/ci/install-tools.sh

      - name: Static checks
        if: matrix.name == 'static'
        env:
          QRYPT_TOOLS_DIR: ${{ github.workspace }}/.cache/qrypt-tools
        run: |
          go vet ./...
          "$QRYPT_TOOLS_DIR/staticcheck" ./...
          "$QRYPT_TOOLS_DIR/golangci-lint" run ./...
          scripts/ci/check-arch.sh
          "$QRYPT_TOOLS_DIR/govulncheck" ./...
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
          generated_schema_before=$(mktemp -d "${TMPDIR:-/tmp}/qrypt-generated-schema.XXXXXX")
          cp pkg/drive/builtin_schema_gen.go "$generated_schema_before/builtin_schema_gen.go"
          cp internal/cli/i18n/catalog_gen.go "$generated_schema_before/catalog_gen.go"
          python3 scripts/schema/check-schema.py
          python3 scripts/schema/gen-drive-schema.py
          python3 scripts/schema/check-cli-i18n.py
          python3 scripts/schema/gen-cli-i18n.py
          if ! cmp -s "$generated_schema_before/builtin_schema_gen.go" pkg/drive/builtin_schema_gen.go || \
             ! cmp -s "$generated_schema_before/catalog_gen.go" internal/cli/i18n/catalog_gen.go; then
            echo "generated schema artifacts are stale; re-run the generators"
            exit 1
          fi
          python3 scripts/schema/test-gen-docs.py
          generated_before=$(mktemp -d "${TMPDIR:-/tmp}/qrypt-generated-docs.XXXXXX")
          trap 'rm -rf "$generated_before"' EXIT
          cp docs/for-user/full-config.md "$generated_before/full-config.md"
          cp docs/for-user/support-drivers.md "$generated_before/support-drivers.md"
          python3 scripts/schema/gen-config-docs.py
          python3 scripts/schema/gen-driver-docs.py
          if ! cmp -s "$generated_before/full-config.md" docs/for-user/full-config.md || \
             ! cmp -s "$generated_before/support-drivers.md" docs/for-user/support-drivers.md; then
            echo "generated user docs are stale; re-run the generators"
            git diff --stat -- docs/for-user/full-config.md docs/for-user/support-drivers.md
            exit 1
          fi
          scripts/install/check-install.sh

      - name: Fast suite
        if: matrix.name == 'fast'
        run: scripts/ci/test-layers.sh fast

      - name: Race suite
        if: matrix.name == 'race'
        run: scripts/ci/test-layers.sh race

      - name: VFS stability and smoke
        if: matrix.name == 'stability'
        run: |
          scripts/ci/test-layers.sh vfs-stability
          scripts/ci/test-layers.sh smoke

      - name: Install script smoke
        if: matrix.name == 'stability'
        run: scripts/install/smoke-install.sh --docker

      # PR-stage coverage visibility: non-blocking snapshot of the six
      # core packages with a highlight on packages changed by this PR.
      # The hard floor gate runs in nightly only (scripts/ci/check-coverage.sh).
      - name: Coverage report (PR snapshot)
        if: github.event_name == 'pull_request' && matrix.name == 'static'
        run: bash scripts/ci/report-coverage.sh "${{ github.event.pull_request.base.sha }}"

  # Windows compile + unit-test gate. Windows is otherwise only a
  # cross-compiled release target built on ubuntu runners, so a broken
  # *_windows.go or the pure-Go nocgo FUSE host would ship untested.
  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Build (nocgo)
        run: go build -tags nocgo -o qrypt.exe ./cmd/qrypt

      - name: Vet
        run: go vet ./...

      # Main-module packages only: `go test ./...` would also run the
      # vendored cgofuse tests, whose Windows host expects a real WinFsp
      # mount. CGO_ENABLED=0 selects the pure-Go nocgo host.
      - name: Unit tests (main module)
        run: go test -count=1 ./pkg/vfs ./pkg/drive ./pkg/drivers/... ./pkg/contracttest ./pkg/vfs/drivecopy ./pkg/control ./pkg/logging ./pkg/mount ./pkg/syncer ./internal/cli ./internal/cli/uninstall ./internal/cli/upgrade ./pkg/core ./pkg/mobile ./pkg/crypt ./pkg/task ./pkg/install ./pkg/selfupdate ./cmd/qrypt

      - name: Installer naming drift (PowerShell)
        run: go test -count=1 ./pkg/install -run 'TestPowerShellInstallerNamingMatchesUpdater'

      - name: Install script smoke (PowerShell)
        shell: pwsh
        run: ./scripts/install/smoke-install.ps1 -Installer ./scripts/install/install.ps1 -Binary ./qrypt.exe

      - name: LocalFS smoke
        shell: bash
        run: |
          # Git Bash mktemp reports unix /tmp paths that a native qrypt.exe
          # resolves against the C: drive root; reroot to a forward-slash
          # Windows path and disable MSYS2's argument path conversion so the
          # /local/... virtual paths reach the CLI unchanged.
          export TMPDIR="${RUNNER_TEMP//\\//}"
          export MSYS2_ARG_CONV_EXCL="*"
          scripts/ci/smoke-localfs.sh

  update-changelog:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: bash scripts/release/gen-changelog.sh "${{ inputs.version || github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化,跳过提交"
          else
            git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

  dist-linux-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check, test-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
            output: qrypt-linux-amd64
            goos: linux
            goarch: amd64
            archive_format: tar.gz
            kind: linux-docker
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            output: qrypt-linux-arm64
            goos: linux
            goarch: arm64
            archive_format: tar.gz
            kind: linux-docker
          - target: windows-amd64
            runner: ubuntu-latest
            output: qrypt-windows-amd64.exe
            goos: windows
            goarch: amd64
            archive_format: zip
            kind: windows-go
          - target: windows-arm64
            runner: ubuntu-latest
            output: qrypt-windows-arm64.exe
            goos: windows
            goarch: arm64
            archive_format: zip
            kind: windows-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 构建 tag 的源码(dispatch 时用 inputs.version),保证二进制内嵌版本号正确
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: matrix.kind == 'windows-go'
        with:
          go-version: "1.27.3"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.kind == 'linux-docker'

      - run: mkdir -p dist

      - name: Build metadata
        run: |
          version="${{ inputs.version || github.ref_name }}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dirty="$(test -n "$(git status --porcelain)" && echo true || echo false)"
          {
            echo "QRYPT_VERSION=${version}"
            echo "QRYPT_COMMIT=${commit}"
            echo "QRYPT_BUILD_TIME=${build_time}"
            echo "QRYPT_DIRTY=${dirty}"
            echo "QRYPT_LDFLAGS=-s -w -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildVersion=${version} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildCommit=${commit} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildTime=${build_time} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildDirty=${dirty}"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} with Docker
        if: matrix.kind == 'linux-docker'
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg VERSION="${QRYPT_VERSION}" \
            --build-arg COMMIT="${QRYPT_COMMIT}" \
            --build-arg BUILD_TIME="${QRYPT_BUILD_TIME}" \
            --build-arg DIRTY="${QRYPT_DIRTY}" \
            --cache-from type=gha,scope=qrypt-${{ matrix.target }} \
            --cache-to type=gha,mode=max,scope=qrypt-${{ matrix.target }} \
            --load \
            -t qrypt:${{ matrix.target }} .
          docker create --name qrypt-${{ matrix.target }} qrypt:${{ matrix.target }}
          docker cp qrypt-${{ matrix.target }}:/usr/local/bin/qrypt dist/${{ matrix.output }}
          docker rm qrypt-${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        if: matrix.kind == 'windows-go'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} go build -tags nocgo -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/${{ matrix.output }} ./cmd/qrypt/

      - name: Package ${{ matrix.target }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          asset="qrypt_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            (cd dist && zip "${asset}.zip" "${{ matrix.output }}")
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${{ matrix.output }}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qrypt-${{ matrix.target }}-${{ inputs.version || github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  dist-darwin:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install macFUSE
        run: |
          brew install --cask macfuse

      - run: mkdir -p dist

      - name: Build metadata
        run: |
          version="${{ inputs.version || github.ref_name }}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dirty="$(test -n "$(git status --porcelain)" && echo true || echo false)"
          {
            echo "QRYPT_VERSION=${version}"
            echo "QRYPT_COMMIT=${commit}"
            echo "QRYPT_BUILD_TIME=${build_time}"
            echo "QRYPT_DIRTY=${dirty}"
            echo "QRYPT_LDFLAGS=-s -w -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildVersion=${version} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildCommit=${commit} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildTime=${build_time} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildDirty=${dirty}"
          } >> "$GITHUB_ENV"

      - name: Build darwin/amd64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/qrypt-darwin-amd64 ./cmd/qrypt/

      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/qrypt-darwin-arm64 ./cmd/qrypt/

      - name: Package darwin binaries
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          tar -C dist -czf "dist/qrypt_${version}_darwin_amd64.tar.gz" qrypt-darwin-amd64
          tar -C dist -czf "dist/qrypt_${version}_darwin_arm64.tar.gz" qrypt-darwin-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qrypt-darwin-${{ inputs.version || github.ref_name }}
          path: dist/*.tar.gz

  windows-release-smoke:
    name: Windows release mount smoke
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [dist-linux-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Smoke-test the script from the same tag as the release binary.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: qrypt-windows-*
          merge-multiple: true
          path: prebuilt

      # Hosted runners are fresh each time: cache the pinned MSI, but install
      # the driver on every run. The script verifies its SHA-256 before use.
      - name: Cache WinFsp MSI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/winfsp/winfsp-2.1.25156.msi
          key: winfsp-msi-windows-2.1.25156-073a70e00f77423e

      - name: Install WinFsp
        shell: pwsh
        run: ./scripts/ci/install-winfsp.ps1

      - name: Extract Windows amd64 release
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path prebuilt -Filter "*_windows_amd64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows amd64 release archive not found" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath release -Force

      - name: Mount smoke (released amd64 binary)
        shell: pwsh
        run: |
          $binary = (Resolve-Path "release/qrypt-windows-amd64.exe").Path
          ./scripts/ci/smoke-windows-mount.ps1 -Binary $binary

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [dist-linux-windows, dist-darwin, windows-release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # dispatch 时 checkout 到发布 tag,与 tag push 行为一致(goreleaser 要求 tag == HEAD)
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -l "${{ inputs.version }}" | grep -q . || { echo "tag ${{ inputs.version }} 不存在"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: qrypt-*
          merge-multiple: true
          path: prebuilt/

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version || github.ref_name }}
