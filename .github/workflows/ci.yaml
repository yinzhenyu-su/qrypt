name: CI

# PR gate plus the post-merge run on main. Feature branches are tested through
# their pull request; tags are handled by release.yaml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs, but never cancel a main run: its detect job records
# the post-merge CI state, and a cancelled run is exactly what release.yaml's
# verify gate refuses to trust.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every merge to main creates a new SHA, but a squash merge keeps the PR head
  # tree byte for byte. When the merged PR already passed the full gate, reuse
  # those checks instead of re-running the whole matrix after every merge. Any
  # uncertainty -- no merged PR, different tree, red or missing checks, API
  # error -- falls back to a normal run.
  detect:
    name: Detect reusable CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.compare.outputs.reuse }}
    steps:
      # Only HEAD's tree is compared, so the default shallow checkout is
      # enough; the PR head commit is fetched explicitly below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare tree and checks with the merged PR
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -u

          required_checks=(
            "Check (static)"
            "Check (fast)"
            "Check (race)"
            "Check (stability)"
            "Test (windows)"
            "PR title"
          )

          # Print "<check name>=<conclusion>" for every required check of a
          # commit. The latest run per name wins so a re-run can clear an
          # earlier failure.
          check_statuses() {
            local sha="$1" runs
            runs="$(gh api "repos/${GH_REPO}/commits/${sha}/check-runs?per_page=100")" || return 1
            printf '%s' "$runs" | jq -r --args '
              [ $ARGS.positional[] as $name
                | ([ .check_runs[] | select(.name == $name) ] | sort_by(.completed_at // "") | last) as $run
                | "\($name)=\($run.conclusion // "missing")"
              ] | .[]' "${required_checks[@]}"
          }

          # Fail open: a false reuse only costs one extra matrix run.
          finish() {
            local reuse="$1" reason="${2:-}"
            echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"
            if [ -n "${reason}" ]; then
              echo "detect: reuse=${reuse} (${reason})"
            else
              echo "detect: reuse=${reuse}"
            fi
            exit 0
          }

          pr_json="$(gh api "repos/${GH_REPO}/commits/${COMMIT_SHA}/pulls" 2>/dev/null)" ||
            finish false "cannot list PRs for ${COMMIT_SHA}"

          pr_number="$(printf '%s' "$pr_json" | jq -r '[.[] | select(.merged_at != null)] | .[0].number // empty')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '[.[] | select(.merged_at != null)] | .[0].head.sha // empty')"
          [ -n "${head_sha}" ] || finish false "no merged PR for ${COMMIT_SHA}"

          if ! git fetch --no-tags --depth=1 origin "${head_sha}" >/dev/null 2>&1; then
            # PR refs stay reachable even after the head branch was deleted.
            git fetch --no-tags --depth=1 origin "refs/pull/${pr_number}/head" >/dev/null 2>&1 ||
              finish false "cannot fetch PR #${pr_number} head ${head_sha}"
          fi

          local_tree="$(git rev-parse 'HEAD^{tree}')"
          head_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          [ "${local_tree}" = "${head_tree}" ] ||
            finish false "tree ${local_tree} differs from PR #${pr_number} head tree ${head_tree}"

          if ! statuses="$(check_statuses "${head_sha}")"; then
            finish false "cannot read check-runs for PR #${pr_number} head ${head_sha}"
          fi
          bad="$(printf '%s\n' "${statuses}" | grep -v '=success$' || true)"
          [ -z "${bad}" ] ||
            finish false "PR #${pr_number} CI is not green: $(printf '%s' "${bad}" | tr '\n' ' ')"

          echo "detect: main commit ${COMMIT_SHA} reuses PR #${pr_number} CI (head ${head_sha})"
          echo "reuse=true" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.name }})
    needs: [detect]
    # !cancelled() is a status function, so GitHub does not append its implicit
    # success() check. detect is skipped on pull requests and fails open with
    # reuse=false on errors; a plain expression would pick up success() and
    # silently skip this job for those cases, i.e. run no CI at all on PRs.
    if: ${{ !cancelled() && needs.detect.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
          - name: fast
          - name: race
          - name: stability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single source of truth for the pinned toolchain.
          go-version-file: go.mod
          cache: true

      - name: Install FUSE headers
        uses: ./.github/actions/setup-fuse

      - name: Cache CI tools
        if: matrix.name == 'static'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.cache/qrypt-tools
          key: qrypt-tools-${{ runner.os }}-${{ hashFiles('tools.go') }}

      - name: Install CI tools
        if: matrix.name == 'static'
        env:
          QRYPT_TOOLS_DIR: ${{ github.workspace }}/.cache/qrypt-tools
        run: |
          scripts/ci/install-tools.sh

      # Cheap repository hygiene that does not depend on the Go build: tidy
      # module files, lint the workflows and the CI shell scripts, and reject
      # trailing whitespace or leftover conflict markers in the PR diff.
      - name: Repo hygiene
        if: matrix.name == 'static'
        env:
          QRYPT_TOOLS_DIR: ${{ github.workspace }}/.cache/qrypt-tools
          QRYPT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          export PATH="$QRYPT_TOOLS_DIR:$PATH"
          scripts/ci/check-hygiene.sh

      - name: Static checks
        if: matrix.name == 'static'
        env:
          QRYPT_TOOLS_DIR: ${{ github.workspace }}/.cache/qrypt-tools
        run: |
          export PATH="$QRYPT_TOOLS_DIR:$PATH"
          go vet ./...
          "$QRYPT_TOOLS_DIR/staticcheck" ./...
          "$QRYPT_TOOLS_DIR/golangci-lint" run ./...
          scripts/ci/check-arch.sh
          "$QRYPT_TOOLS_DIR/govulncheck" ./...
          gofmt_bin="$(go env GOROOT)/bin/gofmt"
          unformatted=$("$gofmt_bin" -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
          generated_schema_before=$(mktemp -d "${TMPDIR:-/tmp}/qrypt-generated-schema.XXXXXX")
          cp pkg/drive/builtin_schema_gen.go "$generated_schema_before/builtin_schema_gen.go"
          cp internal/cli/i18n/catalog_gen.go "$generated_schema_before/catalog_gen.go"
          python3 scripts/schema/check-schema.py
          python3 scripts/schema/gen-drive-schema.py
          python3 scripts/schema/check-cli-i18n.py
          python3 scripts/schema/gen-cli-i18n.py
          if ! cmp -s "$generated_schema_before/builtin_schema_gen.go" pkg/drive/builtin_schema_gen.go || \
             ! cmp -s "$generated_schema_before/catalog_gen.go" internal/cli/i18n/catalog_gen.go; then
            echo "generated schema artifacts are stale; re-run the generators"
            exit 1
          fi
          python3 scripts/schema/test-gen-docs.py
          generated_before=$(mktemp -d "${TMPDIR:-/tmp}/qrypt-generated-docs.XXXXXX")
          trap 'rm -rf "$generated_before"' EXIT
          cp docs/for-user/full-config.md "$generated_before/full-config.md"
          cp docs/for-user/support-drivers.md "$generated_before/support-drivers.md"
          python3 scripts/schema/gen-config-docs.py
          python3 scripts/schema/gen-driver-docs.py
          if ! cmp -s "$generated_before/full-config.md" docs/for-user/full-config.md || \
             ! cmp -s "$generated_before/support-drivers.md" docs/for-user/support-drivers.md; then
            echo "generated user docs are stale; re-run the generators"
            git diff --stat -- docs/for-user/full-config.md docs/for-user/support-drivers.md
            exit 1
          fi
          scripts/install/check-install.sh

      - name: Fast suite
        if: matrix.name == 'fast'
        run: scripts/ci/test-layers.sh fast

      - name: Race suite
        if: matrix.name == 'race'
        run: scripts/ci/test-layers.sh race

      - name: VFS stability and smoke
        if: matrix.name == 'stability'
        run: |
          scripts/ci/test-layers.sh vfs-stability
          scripts/ci/test-layers.sh smoke

      - name: Install script smoke
        if: matrix.name == 'stability'
        run: scripts/install/smoke-install.sh --docker

      # PR-stage coverage visibility: non-blocking snapshot of the six
      # core packages with a highlight on packages changed by this PR.
      # The hard floor gate runs in nightly only (scripts/ci/check-coverage.sh).
      - name: Coverage report (PR snapshot)
        if: github.event_name == 'pull_request' && matrix.name == 'static'
        run: bash scripts/ci/report-coverage.sh "${{ github.event.pull_request.base.sha }}"

  # Squash merges use the PR title as the commit subject and changelog entry.
  # Validate it before merge so features do not silently fall into "Others".
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/check-pr-title.sh "$PR_TITLE"

  # Windows compile + unit-test gate. Windows is otherwise only a
  # cross-compiled release target built on ubuntu runners, so a broken
  # *_windows.go or the pure-Go nocgo FUSE host would ship untested.
  test-windows:
    name: Test (windows)
    needs: [detect]
    # Same gate as `check`: run unless the merged PR already covered this tree.
    if: ${{ !cancelled() && needs.detect.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single source of truth for the pinned toolchain.
          go-version-file: go.mod
          cache: true

      - name: Build (nocgo)
        run: go build -tags nocgo -o qrypt.exe ./cmd/qrypt

      - name: Vet
        run: go vet ./...

      # Main-module packages only: `go test ./...` would also run the
      # vendored cgofuse tests, whose Windows host expects a real WinFsp
      # mount. CGO_ENABLED=0 selects the pure-Go nocgo host.
      #
      # The list mirrors the Linux `race` layer in scripts/ci/test-layers.sh,
      # spelled out instead of the ./pkg/vfs/... wildcard, plus the
      # installer/upgrade packages that only this job covers; keep the two
      # lists in sync. A package that only has *_windows.go or
      # *_windows_test.go must be named explicitly here, because this job is
      # the only place it is compiled and run on Windows: ./pkg/util (Windows
      # file helpers, exercised by its portable tests) and ./internal/cli/i18n
      # (detect_windows_test.go) were missing before.
      - name: Unit tests (main module)
        run: go test -count=1 ./pkg/vfs ./pkg/drive ./pkg/drivers/... ./pkg/contracttest ./pkg/vfs/drivecopy ./pkg/control ./pkg/logging ./pkg/mount ./pkg/syncer ./internal/cli ./internal/cli/uninstall ./internal/cli/upgrade ./internal/cli/i18n ./pkg/core ./pkg/mobile ./pkg/crypt ./pkg/task ./pkg/install ./pkg/selfupdate ./pkg/util ./cmd/qrypt

      - name: Installer naming drift (PowerShell)
        run: go test -count=1 ./pkg/install -run 'TestPowerShellInstallerNamingMatchesUpdater'

      - name: Install script smoke (PowerShell)
        shell: pwsh
        run: ./scripts/install/smoke-install.ps1 -Installer ./scripts/install/install.ps1 -Binary ./qrypt.exe

      - name: LocalFS smoke
        shell: bash
        run: |
          # Git Bash mktemp reports unix /tmp paths that a native qrypt.exe
          # resolves against the C: drive root; reroot to a forward-slash
          # Windows path and disable MSYS2's argument path conversion so the
          # /local/... virtual paths reach the CLI unchanged.
          export TMPDIR="${RUNNER_TEMP//\\//}"
          export MSYS2_ARG_CONV_EXCL="*"
          scripts/ci/smoke-localfs.sh
