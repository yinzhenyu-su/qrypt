name: CI

on:
  push:
    branches: [main, feat/*]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Architecture boundaries
        run: scripts/check-arch.sh

      - name: Vulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # Docs for for-user are generated from qrypt.schema.json; fail the
      # build when the schema changed without regenerating them.
      - name: Generated docs in sync
        run: |
          python3 scripts/gen-config-docs.py
          python3 scripts/gen-driver-docs.py
          if ! git diff --quiet -- docs/for-user/; then
            echo "docs/for-user is stale; re-run:"
            echo "  python3 scripts/gen-config-docs.py"
            echo "  python3 scripts/gen-driver-docs.py"
            git diff --stat docs/for-user/
            exit 1
          fi

      # All test layers delegate to scripts/test-layers.sh so the package
      # lists live in exactly one place; CI only prepares the environment
      # and displays results.
      - name: Fast suite (unit tests)
        run: scripts/test-layers.sh fast

      - name: Race suite
        run: scripts/test-layers.sh race

      - name: VFS stability (x3)
        run: scripts/test-layers.sh vfs-stability

      - name: Localfs smoke
        run: scripts/test-layers.sh smoke

      # PR-stage coverage visibility: non-blocking snapshot of the six
      # core packages with a highlight on packages changed by this PR.
      # The hard floor gate runs in nightly only (scripts/coverage.sh).
      - name: Coverage report (PR snapshot)
        if: github.event_name == 'pull_request'
        run: bash scripts/pr-coverage-report.sh "${{ github.event.pull_request.base.sha }}"

  update-changelog:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: bash scripts/gen-changelog.sh "${{ inputs.version || github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化,跳过提交"
          else
            git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

  dist-linux-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
            output: qrypt-linux-amd64
            goos: linux
            goarch: amd64
            archive_format: tar.gz
            kind: linux-docker
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            output: qrypt-linux-arm64
            goos: linux
            goarch: arm64
            archive_format: tar.gz
            kind: linux-docker
          - target: windows-amd64
            runner: ubuntu-latest
            output: qrypt-windows-amd64.exe
            goos: windows
            goarch: amd64
            archive_format: zip
            kind: windows-go
          - target: windows-arm64
            runner: ubuntu-latest
            output: qrypt-windows-arm64.exe
            goos: windows
            goarch: arm64
            archive_format: zip
            kind: windows-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 构建 tag 的源码(dispatch 时用 inputs.version),保证二进制内嵌版本号正确
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.kind == 'windows-go'
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.kind == 'linux-docker'

      - run: mkdir -p dist

      - name: Build metadata
        run: |
          version="${{ inputs.version || github.ref_name }}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dirty="$(test -n "$(git status --porcelain)" && echo true || echo false)"
          echo "QRYPT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "QRYPT_COMMIT=${commit}" >> "$GITHUB_ENV"
          echo "QRYPT_BUILD_TIME=${build_time}" >> "$GITHUB_ENV"
          echo "QRYPT_DIRTY=${dirty}" >> "$GITHUB_ENV"
          echo "QRYPT_LDFLAGS=-s -w -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildVersion=${version} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildCommit=${commit} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildTime=${build_time} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildDirty=${dirty}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} with Docker
        if: matrix.kind == 'linux-docker'
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg VERSION="${QRYPT_VERSION}" \
            --build-arg COMMIT="${QRYPT_COMMIT}" \
            --build-arg BUILD_TIME="${QRYPT_BUILD_TIME}" \
            --build-arg DIRTY="${QRYPT_DIRTY}" \
            --cache-from type=gha,scope=qrypt-${{ matrix.target }} \
            --cache-to type=gha,mode=max,scope=qrypt-${{ matrix.target }} \
            --load \
            -t qrypt:${{ matrix.target }} .
          docker create --name qrypt-${{ matrix.target }} qrypt:${{ matrix.target }}
          docker cp qrypt-${{ matrix.target }}:/usr/local/bin/qrypt dist/${{ matrix.output }}
          docker rm qrypt-${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        if: matrix.kind == 'windows-go'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} go build -tags nocgo -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/${{ matrix.output }} ./cmd/qrypt/

      - name: Package ${{ matrix.target }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          asset="qrypt_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            (cd dist && zip "${asset}.zip" "${{ matrix.output }}")
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${{ matrix.output }}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qrypt-${{ matrix.target }}-${{ inputs.version || github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  dist-darwin:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install macFUSE
        run: |
          brew install --cask macfuse

      - run: mkdir -p dist

      - name: Build metadata
        run: |
          version="${{ inputs.version || github.ref_name }}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dirty="$(test -n "$(git status --porcelain)" && echo true || echo false)"
          echo "QRYPT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "QRYPT_COMMIT=${commit}" >> "$GITHUB_ENV"
          echo "QRYPT_BUILD_TIME=${build_time}" >> "$GITHUB_ENV"
          echo "QRYPT_DIRTY=${dirty}" >> "$GITHUB_ENV"
          echo "QRYPT_LDFLAGS=-s -w -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildVersion=${version} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildCommit=${commit} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildTime=${build_time} -X github.com/yinzhenyu/qrypt/pkg/buildinfo.buildDirty=${dirty}" >> "$GITHUB_ENV"

      - name: Build darwin/amd64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/qrypt-darwin-amd64 ./cmd/qrypt/

      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="${QRYPT_LDFLAGS}" \
            -o dist/qrypt-darwin-arm64 ./cmd/qrypt/

      - name: Package darwin binaries
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          tar -C dist -czf "dist/qrypt_${version}_darwin_amd64.tar.gz" qrypt-darwin-amd64
          tar -C dist -czf "dist/qrypt_${version}_darwin_arm64.tar.gz" qrypt-darwin-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qrypt-darwin-${{ inputs.version || github.ref_name }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [dist-linux-windows, dist-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # dispatch 时 checkout 到发布 tag,与 tag push 行为一致(goreleaser 要求 tag == HEAD)
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Verify tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -l "${{ inputs.version }}" | grep -q . || { echo "tag ${{ inputs.version }} 不存在"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: qrypt-*
          merge-multiple: true
          path: dist/

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version || github.ref_name }}
