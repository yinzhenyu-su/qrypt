name: Nightly Quality Gates

# Full regression suite that is too slow or too flaky for every PR:
# property fuzzing (30s per fuzzer), the coverage gate, the race suite
# and the layered fast/all suites. Run nightly or on demand.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Fuzz (30s per fuzzer)
        run: scripts/fuzz-nightly.sh 30s

      # A fuzz failure writes corpus entries under testdata/fuzz; the
      # regression inputs must be committed, so surface them as an artifact
      # instead of letting them vanish with the runner.
      - name: Collect fuzz corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore

  gate:
    name: Nightly gate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [coverage, race, regression]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Coverage gate
        if: matrix.name == 'coverage'
        run: scripts/coverage.sh

      - name: Race suite
        if: matrix.name == 'race'
        run: scripts/test-layers.sh race

      - name: Regression suite
        if: matrix.name == 'regression'
        run: |
          scripts/test-layers.sh fast
          scripts/test-layers.sh smoke

  # Deep Windows verification: a real WinFsp mount through the pure-Go
  # nocgo host. Too slow/flaky for every PR; the PR-level Windows gate
  # (build + vet + unit tests + localfs fs smoke) lives in ci.yaml.
  windows-mount:
    name: Windows mount smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install WinFsp
        run: choco install winfsp -y --no-progress

      - name: Build (nocgo)
        env:
          CGO_ENABLED: "0"
        run: go build -tags nocgo -o qrypt.exe ./cmd/qrypt

      - name: Mount smoke (localfs)
        shell: pwsh
        run: ./scripts/smoke-windows-mount.ps1
