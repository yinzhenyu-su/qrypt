name: Nightly Quality Gates

# Full regression suite that is too slow or too flaky for every PR:
# property fuzzing (30s per fuzzer), the coverage gate, the race suite
# and the layered fast/all suites. Run nightly or on demand.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install FUSE headers
        run: |
          # The runner image usually already ships libfuse3-dev, and apt-get
          # update is the slow half of this step; only reach for apt when the
          # headers the cgo build actually needs are missing.
          if pkg-config --exists fuse3; then
            echo "libfuse3-dev already present"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3

      - name: Fuzz (30s per fuzzer)
        run: scripts/ci/fuzz-nightly.sh 30s

      # A fuzz failure writes corpus entries under testdata/fuzz; the
      # regression inputs must be committed, so surface them as an artifact
      # instead of letting them vanish with the runner.
      - name: Collect fuzz corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore

  gate:
    name: Nightly gate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [coverage, race, regression]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install FUSE headers
        run: |
          # The runner image usually already ships libfuse3-dev, and apt-get
          # update is the slow half of this step; only reach for apt when the
          # headers the cgo build actually needs are missing.
          if pkg-config --exists fuse3; then
            echo "libfuse3-dev already present"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3

      - name: Coverage gate
        if: matrix.name == 'coverage'
        run: scripts/ci/check-coverage.sh

      - name: Race suite
        if: matrix.name == 'race'
        run: scripts/ci/test-layers.sh race

      - name: Regression suite
        if: matrix.name == 'regression'
        run: |
          scripts/ci/test-layers.sh fast
          scripts/ci/test-layers.sh smoke

  # Deep Windows verification: a real WinFsp mount through the pure-Go
  # nocgo host. Too slow/flaky for every PR; the PR-level Windows gate
  # (build + vet + unit tests + localfs fs smoke) lives in ci.yaml.
  windows-mount:
    name: Windows mount smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      # Hosted runners are fresh each time: cache the pinned MSI, but install
      # the driver on every run. The script verifies its SHA-256 before use.
      - name: Cache WinFsp MSI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/winfsp/winfsp-2.1.25156.msi
          key: winfsp-msi-windows-2.1.25156-073a70e00f77423e

      - name: Install WinFsp
        shell: pwsh
        run: ./scripts/ci/install-winfsp.ps1

      - name: Build (nocgo)
        env:
          CGO_ENABLED: "0"
        run: go build -tags nocgo -o qrypt.exe ./cmd/qrypt

      - name: Mount smoke (localfs)
        shell: pwsh
        run: ./scripts/ci/smoke-windows-mount.ps1
