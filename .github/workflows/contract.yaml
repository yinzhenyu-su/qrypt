name: Contract Tests

# Runs the real-netdisk contract suite against a live `qrypt mount` debug
# server. Never runs on PRs (real provider credentials are required).
#
#   manual:  pick the mounts to exercise
#   nightly: exercises every mount configured in the variable
#
# Required configuration (repo/org level):
#   Secret   CONTRACT_CONFIG_TOML_B64 - base64 of a qrypt.toml with real
#                                       accounts (never printed; GitHub
#                                       masks it in logs)
#   Variable CONTRACT_MOUNTS_JSON     - e.g. ["p115","quark"]
#
# The mounts list must be a repository VARIABLE, not a secret: GitHub
# masks secret-derived job outputs as ***, which breaks fromJson matrix
# expansion.
on:
  workflow_dispatch:
    inputs:
      mounts:
        description: 'Comma-separated mounts (e.g. "p115,quark")'
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *" # 10:00 Asia/Shanghai

concurrency:
  group: contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mounts: ${{ steps.m.outputs.mounts }}
    steps:
      - id: m
        env:
          INPUT: ${{ inputs.mounts }}
          MOUNTS_VAR: ${{ vars.CONTRACT_MOUNTS_JSON }}
        run: |
          if [ -n "${INPUT:-}" ]; then
            json="[\"$(echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | paste -sd',' -)\"]"
            echo "mounts=$json" >> "$GITHUB_OUTPUT"
          elif [ -n "${MOUNTS_VAR:-}" ]; then
            echo "mounts=$MOUNTS_VAR" >> "$GITHUB_OUTPUT"
          else
            echo "no mounts input and CONTRACT_MOUNTS_JSON variable missing"
            exit 1
          fi

  contract:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mount: ${{ fromJson(needs.setup.outputs.mounts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3

      - name: Write contract config
        env:
          CONFIG_B64: ${{ secrets.CONTRACT_CONFIG_TOML_B64 }}
        run: |
          test -n "$CONFIG_B64" || { echo "CONTRACT_CONFIG_TOML_B64 secret missing"; exit 1; }
          echo "$CONFIG_B64" | base64 -d > ./qrypt.toml

      - name: Build metadata
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dirty="$(test -n "$(git status --porcelain)" && echo true || echo false)"
          echo "QRYPT_LDFLAGS=-s -w -X github.com/yinzhenyu/qrypt/internal/cli.buildVersion=${version} -X github.com/yinzhenyu/qrypt/internal/cli.buildCommit=${commit} -X github.com/yinzhenyu/qrypt/internal/cli.buildTime=${build_time} -X github.com/yinzhenyu/qrypt/internal/cli.buildDirty=${dirty}" >> "$GITHUB_ENV"

      - name: Start mount server
        run: |
          go build -ldflags="${QRYPT_LDFLAGS}" -o /tmp/qrypt ./cmd/qrypt/
          # mount, debug, probe and control share the built-in per-config
          # endpoint derived from the config path; no --socket flag exists.
          nohup /tmp/qrypt mount --config ./qrypt.toml >/tmp/qrypt-mount.log 2>&1 &

      - name: Wait for debug server
        run: |
          for _ in $(seq 1 120); do
            /tmp/qrypt debug raw /v1/health --config ./qrypt.toml >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "mount server did not start:"; cat /tmp/qrypt-mount.log
          exit 1

      - name: "Contract suite: ${{ matrix.mount }}"
        timeout-minutes: 30
        env:
          MOUNT: ${{ matrix.mount }}
        run: |
          # The namespace is built before the debug/control sockets open, so
          # /v1/health only proves the server is up: it stays OK even when a
          # mount failed to initialize. Such a mount is dropped from the
          # namespace (core.buildNamespace logs a warning and continues), and
          # every later request for it answers `mount "X" not found`.
          #
          # Check the mount-scoped endpoint instead of probing blind. It is the
          # only signal that separates "this mount is absent" from "this mount
          # exists but its provider is unhealthy". A missing mount gets one
          # server restart so a transient init failure can succeed; a second
          # miss is an initialization failure (expired credential, rejected
          # session, ...) that retrying the suite can never fix.
          mount_present() {
            local out
            out=$(/tmp/qrypt debug raw "/v1/mounts/health?mount=${MOUNT}" --config ./qrypt.toml 2>&1) && return 0
            echo "$out" >&2
            # Absent mounts answer 502 with `vfs: mount "X" not found`; any
            # other error means the mount exists and its provider is degraded,
            # which the suite reports with a proper failure category.
            ! grep -q "mount \"${MOUNT}\" not found" <<<"$out"
          }
          restart_mount_server() {
            pkill -f '^/tmp/qrypt mount' || true
            sleep 2
            # Append: the first attempt's stderr is what explains a failed init.
            echo "== restarting mount server ==" >>/tmp/qrypt-mount.log
            nohup /tmp/qrypt mount --config ./qrypt.toml >>/tmp/qrypt-mount.log 2>&1 &
            for _ in $(seq 1 120); do
              /tmp/qrypt debug raw /v1/health --config ./qrypt.toml >/dev/null 2>&1 && return 0
              sleep 1
            done
            echo "mount server did not restart:"
            cat /tmp/qrypt-mount.log 2>/dev/null || true
            return 1
          }
          if ! mount_present; then
            echo "== mount \"$MOUNT\" is missing from the server; restarting once so a transient init failure gets a fresh attempt =="
            restart_mount_server
            if ! mount_present; then
              echo "::error::mount \"$MOUNT\" failed to initialize at startup; see the mount failure dump in the failure step below"
              exit 1
            fi
          fi
          # Run the suite exactly once: its exit code is the job result, and a
          # real contract violation must never be masked by a retry.
          /tmp/qrypt probe test contract --config ./qrypt.toml --mount "$MOUNT"

      - name: Dump mount server log on failure
        if: failure()
        run: |
          echo "== mount server stderr =="
          cat /tmp/qrypt-mount.log 2>/dev/null || true
          # Mount init failures (expired session, rejected credential, ...) only
          # reach the runtime file logger, never the stderr above, so the reason
          # a mount is absent is otherwise invisible. Print just the per-mount
          # failure lines: they carry the provider error, not the credentials.
          while IFS= read -r log; do
            echo "== mount init failures in $log =="
            if grep -q -E 'config: mount .* failed' "$log"; then
              grep -E 'config: mount .* failed' "$log" | tail -n 20
            else
              echo "(no mount init failures logged)"
            fi
          done < <(find "$HOME" "$RUNNER_TEMP" -maxdepth 5 -name 'qrypt-error.log' 2>/dev/null)
          # Names, types and the test flag only: [[mounts]] params hold real
          # credentials and must never be printed.
          echo "== mounts in the contract config =="
          awk '/^\[\[mounts\]\]/ { in_mount=1 } /^\[/ && $0 !~ /^\[\[mounts\]\]/ { in_mount=0 }
               in_mount && /^[[:space:]]*(name|type|test_enabled)[[:space:]]*=/ { print }' ./qrypt.toml
