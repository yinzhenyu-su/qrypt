version: "2"

# golangci-lint configuration. Linters are intentionally strict: this repo
# treats lint cleanliness as a CI gate, not a suggestion.
run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - govet         # vet checks (always on)
    - staticcheck   # static analysis (SA/S/ST series)
    - unused        # unused code (equivalent to staticcheck U1000)
    - revive        # golint successor: style + naming rules
    - ineffassign   # assignments that are never used
    - misspell      # common misspellings in comments/strings

  settings:
    revive:
      # revive's default rule set is noisy on an established codebase; enable
      # the rules that catch real problems and leave stylistic ones alone.
      # (v2 runs the default rule set unless explicitly disabled.)
      enable-default-rules: false
      rules:
        - name: exported
        - name: package-comments
        - name: redefines-builtin-id
        - name: error-return
        - name: error-naming
        - name: var-naming
        - name: unexported-return
        - name: range
        - name: bare-return

  exclusions:
    # v1 shipped these exclusions by default; v2 gates them behind presets.
    # Kept here so the gate is no stricter than the historical CI behavior.
    presets:
      - comments            # EXC0011-15: exported symbols without doc comments
      - std-error-handling  # EXC0001: ignored Close/Remove/print errors
      - common-false-positives
      - legacy              # EXC0004/5/8/9: govet/staticcheck/gosec classics
    rules:
      # staticcheck 2026.1 false positive: the assignment IS read via
      # c.dataKey below, but the analyzer does not recognize it.
      - path: pkg/crypt/rclone_cipher_test.go
        linters:
          - staticcheck
        text: "SA4006"

      # pkg/vfs/{read,upload} re-export the historical pkg/vfs-level
      # names (upload.UploadSnapshot, read.ReadObserver, ...) verbatim and
      # pkg/vfs aliases them back for API compatibility; the stutter is
      # intentional, so renaming would only churn call sites. The same
      # applies to internal/cli/debug, which kept the historical cli
      # package's Debug* symbol names through the subcommand split.
      - path: pkg/vfs/(read|upload)/.*\.go
        linters:
          - revive
        text: "stutters"
      - path: internal/cli/debug/.*\.go
        linters:
          - revive
        text: "stutters"

      # Protocol-forced uses of deprecated crypto APIs, documented in-code
      # with //lint:ignore for the standalone staticcheck step (which does
      # not understand //nolint).
      - path: pkg/drivers/(aliyundrive/sign|p189/crypto)\.go
        linters:
          - staticcheck
        text: "SA1019"
